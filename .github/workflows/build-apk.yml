name: Build AMKT VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release needs keystore secrets; debug works without secrets)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure release keystore from GitHub Secrets
        if: ${{ inputs.build_type != 'debug' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, and KEY_ALIAS in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > custom-src/android/app/amkt-release.keystore
          cat <<EOF > custom-src/android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=amkt-release.keystore
          EOF

      - name: Install Flutter dependencies
        working-directory: custom-src
        run: flutter pub get

      - name: Build Release APK
        if: ${{ inputs.build_type != 'debug' }}
        working-directory: custom-src
        run: flutter build apk --release

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: custom-src
        run: flutter build apk --debug

      - name: Upload Release APK
        if: ${{ inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: AMKT-VPN-v1.0.10-release
          path: custom-src/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: AMKT-VPN-v1.0.10-debug
          path: custom-src/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
