name: vpn
description: "Amkt VPN — custom VPN client for Amkt (sing-box core: VLESS, VMess, Trojan, Shadowsocks)."
publish_to: 'none'
version: 1.1.0+12

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # sing-box core (official libbox) inside an Android VpnService.
  sing_box: ^1.0.0
  http: ^1.2.0
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.13.0
  # Android-only WebView settings (used by banner WebView).
  webview_flutter_android: ^4.14.1
  # v1.0.7 — path_provider for the in-app updater fix (getTemporaryDirectory
  # returns the real cache dir, matching <cache-path> in filepaths.xml).
  path_provider: ^2.1.5
  # v1.0.2: local notifications (expiry reminders + foreground FCM) + timezone.
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.2
  # v1.0.2: network-change detection for auto-reconnect.
  connectivity_plus: ^7.3.2
  # v1.0.2: home-screen widget.
  home_widget: ^0.10.0
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  # v1.0.10: Firebase Cloud Messaging (Push Notifications).
  firebase_messaging: ^17.0.1
  installed_apps: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
